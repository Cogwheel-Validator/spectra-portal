name: Lint Commit Messages

on:
  pull_request:
    branches:
      - main
      - dev

env:
  TYPOS_VERSION: v1.48.0
  COCOGITTO_VERSION: 7.0.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install typos
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL -o typos.tar.gz "https://github.com/crate-ci/typos/releases/download/${TYPOS_VERSION}/typos-${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "72a930c9a94fc3914aa56835c5b859c892a797d40c1c42638b98d93f16ff519c  typos.tar.gz" | sha256sum -c -
          tar xzf typos.tar.gz ./typos
          install -m 755 typos "$RUNNER_TEMP/bin/typos"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install cocogitto
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL -o cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb  cog.tar.gz" | sha256sum -c -
          tar xzf cog.tar.gz x86_64-unknown-linux-musl/cog --strip-components=1
          install -m 755 cog "$RUNNER_TEMP/bin/cog"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint commit types and scopes
        run: cog check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Require commit scope
        run: |
          for sha in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            git show -s --format=%B "$sha" > /tmp/msg.txt
            scripts/require-scope.sh /tmp/msg.txt || { echo "::error::Commit $sha is missing a scope"; exit 1; }
          done

      - name: Check commit messages for typos
        run: |
          git log --format=%B "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" > /tmp/commit-msgs.txt
          typos /tmp/commit-msgs.txt
