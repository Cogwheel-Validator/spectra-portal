      title: UserSwap
      additionalProperties: false
    pathfinder.v2beta.WasmData:
      type: object
      properties:
        contract:
          type: string
          title: contract
        msg:
          title: msg
          $ref: '#/components/schemas/pathfinder.v2beta.WasmMsg'
      title: WasmData
      additionalProperties: false
    pathfinder.v2beta.WasmMsg:
      type: object
      properties:
        swap_and_action:
          title: swap_and_action
          $ref: '#/components/schemas/pathfinder.v2beta.SwapAndAction'
      title: WasmMsg
      additionalProperties: false
security: []
tags:
  - name: pathfinder.v2beta.FindPathService
    description: |-
      FindPathService finds and validates routes between two chains for IBC
       transfers and swaps. The unary and streaming methods are kept in the same
       service since they answer the same question, just over different
       transports.
  - name: pathfinder.v2beta.PathfinderQueryService
    description: |-
      PathfinderQueryService provides chain/denom lookups that are independent
       of route-finding. Kept separate from FindPathService so that a breaking
       change to route discovery doesn't force these to be versioned in lockstep.
