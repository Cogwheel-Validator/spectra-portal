        - denom
      additionalProperties: false
      description: |-
        LookupDenomRequest - Resolve token information
         Accepts either:
         - Human-readable denom (e.g., "uatone", "uosmo")
         - IBC denom (e.g., "ibc/ABC123...")
    pathfinder.v2beta.LookupDenomResponse:
      type: object
      properties:
        found:
