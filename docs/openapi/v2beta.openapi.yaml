          title: symbol
          description: Human-readable symbol (e.g., "ATONE", "OSMO")
        base_denom:
          type: string
          title: base_denom
          description: Base denom on origin chain
        origin_chain:
          type: string
          title: origin_chain
          description: Chain where token is native
        decimals:
          type: integer
          title: decimals
          format: int32
          description: Number of decimals
        is_native:
          type: boolean
          title: is_native
          description: True if native to this chain
      title: TokenDetails
      additionalProperties: false
      description: TokenDetails - Full token information
    pathfinder.v2beta.TokenInfo:
      type: object
      properties:
        chain_denom:
          type: string
          title: chain_denom
          description: |-
            The denom as it appears on the chain this TokenInfo is attached to
             (native or IBC hash).
        counterpart_denom:
          type: string
          title: counterpart_denom
          description: |-
            The denom this token has on the other end of the route (the
             counterparty chain named by the enclosing BasicRoute.to_chain_id).
             Renamed from v1's ibc_denom: this gives clearer intent, since the
             value is not always literally an IBC-hash-form denom - it can be a
             native denom when this token originates on the counterparty chain.
        base_denom:
          type: string
          title: base_denom
          description: The base/native denom on the token's origin chain.
        origin_chain:
          type: string
          title: origin_chain
          description: The chain ID where this token is native.
        decimals:
          type: integer
          title: decimals
          format: int32
          description: Number of decimals.
        symbol:
          type: string
          title: symbol
          description: Human-readable symbol (e.g., "ATONE", "OSMO").
      title: TokenInfo
      additionalProperties: false
      description: TokenInfo describes one token allowed on a BasicRoute.
    pathfinder.v2beta.TokenMapping:
      type: object
      properties:
        chain_denom:
          type: string
          title: chain_denom
          description: The denom as it appears on the current chain (native or IBC)
        base_denom:
          type: string
          title: base_denom
          description: The base/native denom on the token's origin chain
        origin_chain:
          type: string
          title: origin_chain
          description: The chain ID where this token is native
        is_native:
          type: boolean
          title: is_native
          description: True if this is the token's native chain
      title: TokenMapping
      additionalProperties: false
    pathfinder.v2beta.Transfer:
