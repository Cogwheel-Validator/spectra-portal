        origin_chain:
          type: string
          title: origin_chain
          description: Where this token is native
        is_native:
          type: boolean
          title: is_native
          description: True if this is the token's native chain
        ibc_path:
          type: string
          title: ibc_path
          description: IBC path if this is an IBC token (e.g., "transfer/channel-75")
        available_on:
          type: array
          items:
            $ref: '#/components/schemas/pathfinder.v2beta.ChainDenom'
          title: available_on
          description: Denoms on other chains where this token is available
      title: LookupDenomResponse
      additionalProperties: false
    pathfinder.v2beta.MinAsset:
